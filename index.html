<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT Team Hub Pro v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .tab-active { border-bottom: 3px solid #4f46e5; color: #4f46e5; }
        .hide { display: none; }
    </script>
</head>
<body class="bg-slate-50 min-h-screen pb-20">

    <!-- Navigation Tabs -->
    <nav class="bg-white shadow-sm sticky top-0 z-50 mb-6">
        <div class="max-w-6xl mx-auto px-4 flex space-x-8">
            <button onclick="switchTab('input')" id="tab-input" class="py-4 px-2 font-bold tab-active transition-all text-sm uppercase tracking-wider">Giao Việc</button>
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="py-4 px-2 font-bold text-slate-400 transition-all text-sm uppercase tracking-wider">Dashboard Tuần/Dự án</button>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4">
        
        <!-- TAB 1: NHẬP LIỆU -->
        <section id="section-input" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Form -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="font-black text-slate-800 mb-6 text-xl uppercase tracking-tighter">New Task Group</h2>
                    
                    <div class="space-y-4">
                        <input type="text" id="projName" placeholder="Tên Project (VD: Pitch Deck X)" class="w-full bg-slate-100 p-3 rounded-xl border-none outline-indigo-500 font-bold">
                        
                        <select id="staff" class="w-full bg-slate-100 p-3 rounded-xl border-none font-bold">
                            <option value="Khanh">Khanh (Exe L1)</option>
                            <option value="Thùy">Thùy (Exe L4)</option>
                            <option value="Vân Anh">Vân Anh (Exe L4)</option>
                        </select>

                        <select id="taskType" class="w-full bg-slate-100 p-3 rounded-xl border-none font-bold" onchange="toggleLevelUI()">
                            <option value="slides">Slides Content</option>
                            <option value="slideMaster">Slide Master</option>
                            <option value="convert">Convert</option>
                            <option value="redo">Redo Slide</option>
                            <option value="animation">Animation</option>
                            <option value="timed">QA/Word/Edit/Other</option>
                        </select>

                        <!-- Level Splitter -->
                        <div id="levelSplitter" class="p-4 bg-indigo-50 rounded-xl space-y-3">
                            <p class="text-[10px] font-black text-indigo-400 uppercase">Phân bổ Level & Số lượng</p>
                            <div id="levelRows" class="space-y-2">
                                <div class="flex gap-2 level-row">
                                    <select class="row-level bg-white p-2 rounded-lg text-xs font-bold border-none">
                                        <option value="L5">L5</option><option value="L4">L4</option><option value="L3" selected>L3</option><option value="L2">L2</option><option value="L1">L1</option>
                                    </select>
                                    <input type="number" placeholder="SL" class="row-qty w-full bg-white p-2 rounded-lg text-xs font-bold border-none">
                                </div>
                            </div>
                            <button onclick="addLevelRow()" class="text-indigo-600 text-[10px] font-bold">+ Thêm dòng Level</button>
                        </div>

                        <textarea id="desc" placeholder="Ghi chú (VD: Slide 1-5 level 3, Slide 6-10 level 2...)" class="w-full bg-slate-100 p-3 rounded-xl border-none text-sm h-24"></textarea>

                        <button onclick="saveTask()" class="w-full bg-indigo-600 text-white font-black py-4 rounded-xl shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all uppercase tracking-widest">Lưu Task & Tính Workload</button>
                    </div>
                </div>
            </div>

            <!-- List Today -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-end mb-6">
                        <h2 class="font-black text-slate-800 text-xl uppercase tracking-tighter">Hôm nay</h2>
                        <button onclick="clearData()" class="text-[10px] text-red-400 font-bold uppercase underline">Reset Data</button>
                    </div>
                    <canvas id="todayChart" height="100"></canvas>
                </div>

                <div id="recentTasks" class="space-y-3">
                    <!-- Tasks will appear here -->
                </div>
            </div>
        </section>

        <!-- TAB 2: DASHBOARD -->
        <section id="section-dashboard" class="hide space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Weekly Report -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center">
                    <h2 class="font-black text-slate-700 mb-6 uppercase tracking-widest text-sm">Hiệu suất theo Tuần (Total Mins)</h2>
                    <canvas id="weeklyChart"></canvas>
                </div>
                <!-- Project Report -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="font-black text-slate-700 mb-6 uppercase tracking-widest text-sm">Tổng cộng theo Dự án</h2>
                    <canvas id="projectChart"></canvas>
                </div>
            </div>
        </section>

    </div>

    <script>
        const CAPACITY = 450;
        const MATRIX = {
            slides: {L5:180, L4:90, L3:45, L2:30, L1:10},
            slideMaster: {L5:90, L4:45, L3:30, L2:15, L1:5},
            convert: {L5:90, L4:60, L3:30, L2:10, L1:5},
            redo: {L5:180, L4:90, L3:60, L2:30, L1:10},
            animation: {L5:90, L4:45, L3:30, L2:15, L1:5},
            timed: 30
        };

        let allTasks = JSON.parse(localStorage.getItem('slide_data')) || [];

        function switchTab(tab) {
            document.getElementById('section-input').classList.toggle('hide', tab !== 'input');
            document.getElementById('section-dashboard').classList.toggle('hide', tab !== 'dashboard');
            document.getElementById('tab-input').classList.toggle('tab-active', tab === 'input');
            document.getElementById('tab-dashboard').classList.toggle('tab-active', tab === 'dashboard');
            if(tab === 'dashboard') renderDashboard();
        }

        function addLevelRow() {
            const container = document.getElementById('levelRows');
            const newRow = document.createElement('div');
            newRow.className = "flex gap-2 level-row animate-slide-down";
            newRow.innerHTML = `
                <select class="row-level bg-white p-2 rounded-lg text-xs font-bold border-none">
                    <option value="L5">L5</option><option value="L4">L4</option><option value="L3" selected>L3</option><option value="L2">L2</option><option value="L1">L1</option>
                </select>
                <input type="number" placeholder="SL" class="row-qty w-full bg-white p-2 rounded-lg text-xs font-bold border-none">
            `;
            container.appendChild(newRow);
        }

        function toggleLevelUI() {
            const type = document.getElementById('taskType').value;
            document.getElementById('levelSplitter').style.display = type === 'timed' ? 'none' : 'block';
        }

        function saveTask() {
            const proj = document.getElementById('projName').value || "No Project";
            const staff = document.getElementById('staff').value;
            const type = document.getElementById('taskType').value;
            const desc = document.getElementById('desc').value;
            const date = new Date().toISOString().split('T')[0];
            const week = getWeekNumber(new Date());

            let totalMins = 0;
            let breakdown = [];

            if(type === 'timed') {
                const qty = parseInt(document.querySelector('.row-qty').value) || 0;
                totalMins = qty * MATRIX.timed;
                breakdown.push(`${qty} đơn vị 30p`);
            } else {
                const rows = document.querySelectorAll('.level-row');
                rows.forEach(row => {
                    const l = row.querySelector('.row-level').value;
                    const q = parseInt(row.querySelector('.row-qty').value) || 0;
                    totalMins += MATRIX[type][l] * q;
                    if(q > 0) breakdown.push(`${q} slide ${l}`);
                });
            }

            if(totalMins === 0) return alert("Nhập số lượng bro ơi!");

            const taskEntry = { id: Date.now(), proj, staff, type, totalMins, desc, breakdown, date, week };
            allTasks.push(taskEntry);
            localStorage.setItem('slide_data', JSON.stringify(allTasks));
            
            // Reset form
            document.getElementById('projName').value = "";
            document.getElementById('desc').value = "";
            document.getElementById('levelRows').innerHTML = `
                <div class="flex gap-2 level-row">
                    <select class="row-level bg-white p-2 rounded-lg text-xs font-bold border-none">
                        <option value="L5">L5</option><option value="L4">L4</option><option value="L3" selected>L3</option><option value="L2">L2</option><option value="L1">L1</option>
                    </select>
                    <input type="number" placeholder="SL" class="row-qty w-full bg-white p-2 rounded-lg text-xs font-bold border-none">
                </div>
            `;
            
            renderToday();
        }

        function renderToday() {
            const today = new Date().toISOString().split('T')[0];
            const todayTasks = allTasks.filter(t => t.date === today);
            
            const stats = { Khanh: 0, "Thùy": 0, "Vân Anh": 0 };
            todayTasks.forEach(t => stats[t.staff] += t.totalMins);

            updateChart('todayChart', Object.keys(stats), Object.values(stats));

            const listContainer = document.getElementById('recentTasks');
            listContainer.innerHTML = todayTasks.reverse().map(t => `
                <div class="bg-white p-4 rounded-xl border-l-4 border-indigo-500 shadow-sm flex justify-between items-start">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="font-black text-xs uppercase text-indigo-600">${t.proj}</span>
                            <span class="text-[10px] bg-slate-100 px-2 py-0.5 rounded text-slate-400 font-bold">${t.staff}</span>
                        </div>
                        <p class="text-xs font-bold text-slate-700">${t.type.toUpperCase()} - ${t.breakdown.join(', ')}</p>
                        <p class="text-[10px] text-slate-400 mt-1 italic">${t.desc}</p>
                    </div>
                    <div class="text-right">
                        <span class="font-black text-slate-800">${t.totalMins}m</span>
                    </div>
                </div>
            `).join('');
        }

        let charts = {};
        function updateChart(id, labels, data) {
            if(charts[id]) charts[id].destroy();
            const ctx = document.getElementById(id).getContext('2d');
            charts[id] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        data,
                        backgroundColor: data.map(v => v > CAPACITY && id==='todayChart' ? '#ef4444' : '#6366f1'),
                        borderRadius: 12
                    }]
                },
                options: { 
                    indexAxis: id === 'todayChart' ? 'y' : 'x',
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, grid: {display:false} }, x: { grid: {display:false} } }
                }
            });
        }

        function renderDashboard() {
            // Project Chart
            const projStats = {};
            allTasks.forEach(t => { projStats[t.proj] = (projStats[t.proj] || 0) + t.totalMins; });
            updateChart('projectChart', Object.keys(projStats), Object.values(projStats));

            // Weekly Chart (Per staff)
            const staffWeekly = { Khanh: 0, "Thùy": 0, "Vân Anh": 0 };
            const currentWeek = getWeekNumber(new Date());
            allTasks.filter(t => t.week === currentWeek).forEach(t => staffWeekly[t.staff] += t.totalMins);
            updateChart('weeklyChart', Object.keys(staffWeekly), Object.values(staffWeekly));
        }

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
        }

        function clearData() {
            if(confirm("Xóa hết dữ liệu đã lưu?")) {
                localStorage.removeItem('slide_data');
                allTasks = [];
                renderToday();
            }
        }

        window.onload = renderToday;
    </script>
</body>
</html>
