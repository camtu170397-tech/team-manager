<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT Team Hub - Auto Count v4.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .tab-active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: 900; }
        .hide { display: none; }
        .animate-pop { animation: pop 0.3s ease-out; }
        @keyframes pop { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <!-- Navigation với màu sắc mới để nhận diện -->
    <nav class="bg-slate-900 shadow-xl sticky top-0 z-50 mb-6 text-white">
        <div class="max-w-6xl mx-auto px-4 flex space-x-8">
            <button onclick="switchTab('input')" id="tab-input" class="py-5 px-2 text-indigo-400 border-b-4 border-indigo-400 font-black text-xs uppercase tracking-[0.2em]">Giao Việc & Đếm Slide</button>
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="py-5 px-2 text-slate-400 font-black text-xs uppercase tracking-[0.2em]">Dashboard Thống Kê</button>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 pb-20">
        
        <section id="section-input" class="grid grid-cols-1 lg:grid-cols-3 gap-8 animate-pop">
            <!-- Form Bên Trái -->
            <div class="lg:col-span-1">
                <div class="bg-white p-7 rounded-[2rem] shadow-2xl border border-slate-200">
                    <h2 class="font-black text-slate-800 mb-8 text-2xl uppercase tracking-tighter">New Task</h2>
                    
                    <div class="space-y-6">
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Tên Dự Án</label>
                            <input type="text" id="projName" placeholder="VD: Sapo Pitch Deck" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 outline-indigo-500 font-bold mt-1 shadow-inner">
                        </div>
                        
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Người phụ trách</label>
                            <select id="staff" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 font-bold mt-1">
                                <option value="Khanh">Khanh (Exe L1)</option>
                                <option value="Thùy">Thùy (Exe L4)</option>
                                <option value="Vân Anh">Vân Anh (Exe L4)</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Loại Task</label>
                            <select id="taskType" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 font-bold mt-1" onchange="toggleLevelUI()">
                                <option value="slides">Thiết kế Slides</option>
                                <option value="slideMaster">Slide Master</option>
                                <option value="convert">Convert Slide</option>
                                <option value="redo">Redo / Sửa lại</option>
                                <option value="animation">Animation</option>
                                <option value="timed">QA/Word/Other (0.5h)</option>
                            </select>
                        </div>

                        <!-- HỆ THỐNG LIỆT KÊ SLIDE ĐỂ TỰ ĐẾM -->
                        <div id="levelSplitter" class="p-6 bg-indigo-50 rounded-[2rem] border border-indigo-100 space-y-5">
                            <p class="text-[10px] font-black text-indigo-500 uppercase tracking-[0.2em]">Liệt kê Slide theo Level</p>
                            <div id="levelRows" class="space-y-5">
                                <div class="level-row space-y-2">
                                    <div class="flex justify-between items-center px-1">
                                        <select class="row-level bg-transparent font-black text-indigo-600 border-none text-xs outline-none">
                                            <option value="L5">LEVEL 5</option><option value="L4">LEVEL 4</option><option value="L3" selected>LEVEL 3</option><option value="L2">LEVEL 2</option><option value="L1">LEVEL 1</option>
                                        </select>
                                        <span class="text-[10px] bg-indigo-200 text-indigo-700 px-2 py-1 rounded-full font-black count-badge">0 SLIDE</span>
                                    </div>
                                    <!-- Ô NHẬP TEXT ĐỂ ĐẾM CHỮ -->
                                    <input type="text" oninput="autoCount(this)" placeholder="Gõ: s1 s2 s3 s4..." class="row-slides w-full bg-white p-4 rounded-xl text-xs font-bold border-none shadow-sm outline-indigo-400">
                                </div>
                            </div>
                            <button onclick="addLevelRow()" class="w-full py-3 border-2 border-dashed border-indigo-200 rounded-2xl text-indigo-400 text-[10px] font-black hover:bg-indigo-100 transition-all uppercase">+ THÊM LEVEL KHÁC</button>
                        </div>

                        <button onclick="saveTask()" class="w-full bg-indigo-600 text-white font-black py-5 rounded-2xl shadow-xl shadow-indigo-200 hover:bg-indigo-700 hover:-translate-y-1 transition-all uppercase tracking-widest">Lưu & Tính Workload</button>
                    </div>
                </div>
            </div>

            <!-- List Bên Phải -->
            <div class="lg:col-span-2 space-y-8">
                <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-200">
                    <div class="flex justify-between items-start mb-8">
                        <div>
                            <h2 class="font-black text-slate-800 text-3xl uppercase tracking-tighter italic">Today</h2>
                            <p id="dateVal" class="text-xs text-slate-400 font-bold mt-1"></p>
                        </div>
                        <button onclick="clearData()" class="text-[10px] text-slate-300 font-black uppercase hover:text-red-500 transition-colors">Clear All</button>
                    </div>
                    <div class="h-56">
                        <canvas id="todayChart"></canvas>
                    </div>
                </div>

                <div id="recentTasks" class="grid grid-cols-1 gap-4">
                    <!-- Task logs load here -->
                </div>
            </div>
        </section>

        <!-- DASHBOARD TAB -->
        <section id="section-dashboard" class="hide space-y-8 animate-pop">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="bg-white p-10 rounded-[2.5rem] shadow-xl border border-slate-200">
                    <h2 class="text-slate-400 mb-8 uppercase text-xs font-black tracking-[0.3em] text-center">Workload Tuần Này</h2>
                    <canvas id="weeklyChart"></canvas>
                </div>
                <div class="bg-white p-10 rounded-[2.5rem] shadow-xl border border-slate-200">
                    <h2 class="text-slate-400 mb-8 uppercase text-xs font-black tracking-[0.3em] text-center">Workload Theo Dự Án</h2>
                    <canvas id="projectChart"></canvas>
                </div>
            </div>
        </section>
    </div>

    <script>
        const CAPACITY = 450;
        const MATRIX = {
            slides: {L5:180, L4:90, L3:45, L2:30, L1:10},
            slideMaster: {L5:90, L4:45, L3:30, L2:15, L1:5},
            convert: {L5:90, L4:60, L3:30, L2:10, L1:5},
            redo: {L5:180, L4:90, L3:60, L2:30, L1:10},
            animation: {L5:90, L4:45, L3:30, L2:15, L1:5},
            timed: 30
        };

        let allTasks = JSON.parse(localStorage.getItem('slide_data_v4.1')) || [];

        function autoCount(input) {
            const val = input.value.trim();
            const badge = input.parentElement.querySelector('.count-badge');
            // Đếm các từ cách nhau bằng khoảng trắng hoặc phẩy
            const count = val === "" ? 0 : val.split(/[\s,]+/).filter(x => x.length > 0).length;
            badge.innerText = `${count} SLIDE`;
            return count;
        }

        function addLevelRow() {
            const container = document.getElementById('levelRows');
            const div = document.createElement('div');
            div.className = "level-row space-y-2 animate-pop mt-4 border-t pt-4 border-indigo-100";
            div.innerHTML = `
                <div class="flex justify-between items-center px-1">
                    <select class="row-level bg-transparent font-black text-indigo-600 border-none text-xs outline-none">
                        <option value="L5">LEVEL 5</option><option value="L4">LEVEL 4</option><option value="L3" selected>LEVEL 3</option><option value="L2">LEVEL 2</option><option value="L1">LEVEL 1</option>
                    </select>
                    <span class="text-[10px] bg-indigo-200 text-indigo-700 px-2 py-1 rounded-full font-black count-badge">0 SLIDE</span>
                </div>
                <input type="text" oninput="autoCount(this)" placeholder="Gõ: s1 s2 s3 s4..." class="row-slides w-full bg-white p-4 rounded-xl text-xs font-bold border-none shadow-sm outline-indigo-400">
            `;
            container.appendChild(div);
        }

        function saveTask() {
            const proj = document.getElementById('projName').value || "Project Lẻ";
            const staff = document.getElementById('staff').value;
            const type = document.getElementById('taskType').value;
            const date = new Date().toISOString().split('T')[0];
            const week = getWeekNumber(new Date());

            let totalMins = 0;
            let breakdown = [];

            document.querySelectorAll('.level-row').forEach(row => {
                const level = row.querySelector('.row-level').value;
                const slidesText = row.querySelector('.row-slides').value;
                const count = autoCount(row.querySelector('.row-slides'));
                
                if(count > 0) {
                    const mins = type === 'timed' ? count * MATRIX.timed : MATRIX[type][level] * count;
                    totalMins += mins;
                    breakdown.push({ level, count, slidesText });
                }
            });

            if(totalMins === 0) return alert("Bro ơi, chưa liệt kê slide nào cả!");

            allTasks.push({ id: Date.now(), proj, staff, type, totalMins, breakdown, date, week });
            localStorage.setItem('slide_data_v4.1', JSON.stringify(allTasks));
            
            // Reset form
            document.getElementById('projName').value = "";
            document.getElementById('levelRows').innerHTML = `
                <div class="level-row space-y-2">
                    <div class="flex justify-between items-center px-1">
                        <select class="row-level bg-transparent font-black text-indigo-600 border-none text-xs outline-none">
                            <option value="L5">LEVEL 5</option><option value="L4">LEVEL 4</option><option value="L3" selected>LEVEL 3</option><option value="L2">LEVEL 2</option><option value="L1">LEVEL 1</option>
                        </select>
                        <span class="text-[10px] bg-indigo-200 text-indigo-700 px-2 py-1 rounded-full font-black count-badge">0 SLIDE</span>
                    </div>
                    <input type="text" oninput="autoCount(this)" placeholder="Gõ: s1 s2 s3 s4..." class="row-slides w-full bg-white p-4 rounded-xl text-xs font-bold border-none shadow-sm outline-indigo-400">
                </div>
            `;
            renderToday();
        }

        function renderToday() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dateVal').innerText = new Date().toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'long' });
            
            const todayTasks = allTasks.filter(t => t.date === today);
            const stats = { Khanh: 0, "Thùy": 0, "Vân Anh": 0 };
            todayTasks.forEach(t => stats[t.staff] += t.totalMins);
            updateChart('todayChart', Object.keys(stats), Object.values(stats), true);

            document.getElementById('recentTasks').innerHTML = todayTasks.slice().reverse().map(t => `
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 flex justify-between items-center animate-pop">
                    <div>
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-[10px] font-black px-3 py-1 bg-slate-800 text-white rounded-full uppercase tracking-tighter">${t.proj}</span>
                            <span class="text-[10px] font-black text-indigo-500 uppercase tracking-widest">${t.staff}</span>
                        </div>
                        <div class="space-y-2">
                            ${t.breakdown.map(b => `
                                <div class="flex items-center">
                                    <div class="w-1.5 h-1.5 rounded-full bg-indigo-400 mr-2"></div>
                                    <p class="text-xs font-black text-slate-700 uppercase leading-none">
                                        ${b.level}: <span class="text-indigo-600">${b.count} SLIDE</span> 
                                        <span class="text-slate-300 font-normal ml-1 lowercase italic">(${b.slidesText})</span>
                                    </p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-3xl font-black text-slate-800 tracking-tighter">${t.totalMins}<span class="text-xs ml-1 text-slate-300 italic">min</span></p>
                    </div>
                </div>
            `).join('');
        }

        let charts = {};
        function updateChart(id, labels, data, isHorizontal) {
            if(charts[id]) charts[id].destroy();
            const ctx = document.getElementById(id).getContext('2d');
            charts[id] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        data,
                        backgroundColor: data.map(v => v > CAPACITY && id === 'todayChart' ? '#f43f5e' : '#6366f1'),
                        borderRadius: 20,
                        barThickness: 20
                    }]
                },
                options: { 
                    indexAxis: isHorizontal ? 'y' : 'x',
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { beginAtZero: true, grid: {display:false}, ticks: {font:{weight:'bold', size:10}} }, 
                        x: { grid: {display:false}, ticks: {font:{weight:'bold', size:10}}, max: isHorizontal ? 600 : undefined } 
                    }
                }
            });
        }

        function renderDashboard() {
            const projStats = {};
            allTasks.forEach(t => { projStats[t.proj] = (projStats[t.proj] || 0) + t.totalMins; });
            updateChart('projectChart', Object.keys(projStats), Object.values(projStats), false);

            const staffWeekly = { Khanh: 0, "Thùy": 0, "Vân Anh": 0 };
            const currentWeek = getWeekNumber(new Date());
            allTasks.filter(t => t.week === currentWeek).forEach(t => staffWeekly[t.staff] += t.totalMins);
            updateChart('weeklyChart', Object.keys(staffWeekly), Object.values(staffWeekly), false);
        }

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            return Math.ceil((((d - new Date(Date.UTC(d.getUTCFullYear(),0,1))) / 86400000) + 1)/7);
        }

        function switchTab(tab) {
            document.getElementById('section-input').classList.toggle('hide', tab !== 'input');
            document.getElementById('section-dashboard').classList.toggle('hide', tab !== 'dashboard');
            const btnIn = document.getElementById('tab-input');
            const btnDash = document.getElementById('tab-dashboard');
            if(tab === 'input') {
                btnIn.classList.add('text-indigo-400', 'border-b-4', 'border-indigo-400');
                btnDash.classList.remove('text-indigo-400', 'border-b-4', 'border-indigo-400');
                btnDash.classList.add('text-slate-400');
            } else {
                btnDash.classList.add('text-indigo-400', 'border-b-4', 'border-indigo-400');
                btnIn.classList.remove('text-indigo-400', 'border-b-4', 'border-indigo-400');
                btnIn.classList.add('text-slate-400');
                renderDashboard();
            }
        }

        function toggleLevelUI() {
            const type = document.getElementById('taskType').value;
            document.getElementById('levelSplitter').style.display = type === 'timed' ? 'none' : 'block';
        }

        function clearData() { if(confirm("Xóa lịch sử?")) { localStorage.removeItem('slide_data_v4.1'); allTasks = []; renderToday(); } }
        window.onload = renderToday;
    </script>
</body>
</html>
