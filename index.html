<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT Team Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm">
            <div>
                <h1 class="text-2xl font-black text-indigo-600 uppercase tracking-tight">Slide Team Hub</h1>
                <p class="text-slate-500 text-sm font-medium">Manager: Bro | Team: 4 persons</p>
            </div>
            <div class="text-right">
                <span class="text-[10px] font-bold text-slate-400 uppercase block">Daily Limit</span>
                <span class="text-xl font-bold text-red-500">450 min</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Form Nhập Liệu -->
            <div class="bg-white p-6 rounded-2xl shadow-sm h-fit border border-slate-200">
                <h2 class="font-bold text-slate-700 mb-4"><i class="fa-solid fa-plus-circle mr-2 text-indigo-500"></i>Giao Task</h2>
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Nhân viên</label>
                        <select id="staff" class="w-full bg-slate-50 p-3 rounded-lg border-none text-sm outline-indigo-500 font-medium">
                            <option value="Khanh">Khanh (Exe L1)</option>
                            <option value="Thùy">Thùy (Exe L4)</option>
                            <option value="Vân Anh">Vân Anh (Exe L4)</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Loại Task</label>
                            <select id="taskType" class="w-full bg-slate-50 p-3 rounded-lg border-none text-sm outline-indigo-500 font-medium" onchange="toggleLevel()">
                                <option value="slides">Slides</option>
                                <option value="slideMaster">Slide Master</option>
                                <option value="convert">Convert</option>
                                <option value="redo">Redo Slide</option>
                                <option value="animation">Animation</option>
                                <option value="timed">QA/Word/Edit...</option>
                            </select>
                        </div>
                        <div id="levelContainer">
                            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Level</label>
                            <select id="level" class="w-full bg-slate-50 p-3 rounded-lg border-none text-sm outline-indigo-500 font-medium">
                                <option value="L5">L5</option><option value="L4">L4</option><option value="L3" selected>L3</option><option value="L2">L2</option><option value="L1">L1</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label id="qtyLabel" class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Số lượng Slide</label>
                        <input type="number" id="qty" value="1" min="1" class="w-full bg-slate-50 p-3 rounded-lg border-none outline-indigo-500">
                    </div>
                    <button onclick="addTask()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition shadow-lg shadow-indigo-100">Cập nhật</button>
                </div>
            </div>

            <!-- Dashboard -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="font-bold text-slate-700 mb-6 flex justify-between">
                        <span><i class="fa-solid fa-chart-bar mr-2 text-indigo-500"></i>Workload Real-time</span>
                        <span id="dateDisplay" class="text-slate-400 text-xs"></span>
                    </h2>
                    <canvas id="workloadChart" height="120"></canvas>
                </div>

                <!-- History -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="p-4 text-slate-400 font-bold uppercase text-[10px]">Nhân viên</th>
                                <th class="p-4 text-slate-400 font-bold uppercase text-[10px]">Công việc</th>
                                <th class="p-4 text-slate-400 font-bold uppercase text-[10px] text-right">Phút</th>
                            </tr>
                        </thead>
                        <tbody id="taskLog"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CAPACITY = 450;
        const MATRIX = {
            slides: {L5:180, L4:90, L3:45, L2:30, L1:10},
            slideMaster: {L5:90, L4:45, L3:30, L2:15, L1:5},
            convert: {L5:90, L4:60, L3:30, L2:10, L1:5},
            redo: {L5:180, L4:90, L3:60, L2:30, L1:10},
            animation: {L5:90, L4:45, L3:30, L2:15, L1:5},
            timed: 30
        };

        let data = {
            Khanh: 0, "Thùy": 0, "Vân Anh": 0
        };

        document.getElementById('dateDisplay').innerText = new Date().toLocaleDateString();

        const ctx = document.getElementById('workloadChart').getContext('2d');
        let chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Khanh', 'Thùy', 'Vân Anh'],
                datasets: [{
                    label: 'Số phút đã làm',
                    data: [0, 0, 0],
                    backgroundColor: ['#10b981', '#10b981', '#10b981'],
                    borderRadius: 8
                }]
            },
            options: { 
                indexAxis: 'y',
                scales: { x: { max: 600, grid: { display: false } } },
                plugins: { legend: { display: false } }
            }
        });

        function toggleLevel() {
            const type = document.getElementById('taskType').value;
            document.getElementById('levelContainer').style.opacity = type === 'timed' ? '0.3' : '1';
            document.getElementById('qtyLabel').innerText = type === 'timed' ? 'Số đơn vị (30p/đv)' : 'Số lượng Slide';
        }

        function addTask() {
            const staff = document.getElementById('staff').value;
            const type = document.getElementById('taskType').value;
            const level = document.getElementById('level').value;
            const qty = parseInt(document.getElementById('qty').value);
            
            let mins = type === 'timed' ? qty * MATRIX.timed : MATRIX[type][level] * qty;
            
            data[staff] += mins;
            
            // Cập nhật Chart
            chart.data.datasets[0].data = [data.Khanh, data['Thùy'], data['Vân Anh']];
            chart.data.datasets[0].backgroundColor = chart.data.datasets[0].data.map(v => v > CAPACITY ? '#ef4444' : '#10b981');
            chart.update();

            // Cập nhật Log
            const log = document.getElementById('taskLog');
            const row = `border-t border-slate-100 hover:bg-slate-50">
                <td class="p-4 font-bold text-slate-700">${staff}</td>
                <td class="p-4 text-slate-500">${type} (${type === 'timed' ? '' : level}) x${qty}</td>
                <td class="p-4 text-right font-black text-slate-700">${mins}m</td>
            </tr>`;
            log.innerHTML = row + log.innerHTML;
        }
    </script>
</body>
</html>
